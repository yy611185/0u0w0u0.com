name: Format Fix

on:
  push:
    branches:
      - chore/icons-readme-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/icons-readme-refresh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format DesignSystem.md
        run: npx prettier --write DesignSystem.md

      - name: Commit formatting fix
        shell: bash
        run: |
          if git diff --quiet -- DesignSystem.md; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DesignSystem.md
          git commit -m "style: format DesignSystem.md"
          git push origin HEAD:chore/icons-readme-refresh
