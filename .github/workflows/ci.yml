name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Inspect formatting
        run: |
          npx prettier --write src/components/pages.tsx src/content/shared.ts
          git diff -- src/components/pages.tsx src/content/shared.ts
          exit 1

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
